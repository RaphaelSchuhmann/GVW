name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gvw-office/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gvw-office/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gvw-office/gvw-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests
        run: ./mvnw test

      - name: Build
        run: ./mvnw package

  gvw-deployment:
    name: GVW-Deployment
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gvw-office/gvw-deployment

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: gvw-office/gvw-deployment/go.mod
          cache: true
          cache-dependency-path: gvw-office/gvw-deployment/go.sum

      - name: Run tests
        run: go test ./...

      - name: Build
        run: go build ./...
